<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 1005" width="820" height="1005" role="img" aria-labelledby="t d" font-family="Segoe UI, system-ui, -apple-system, Helvetica, Arial, sans-serif">
  <title id="t">Review process, part 2: the remedy step</title>
  <desc id="d">From an Alternate access required risk grade through the more-accessible-product, TAAP on file, TAAP minimum, meets-none and determination checks to Deny or Approve with TAAP, with holds 4 and 5 hanging off the checks they resume at.</desc>
  <defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b6b6b"/></marker></defs>
  <rect width="820" height="1005" fill="#ffffff"/>
  
  <rect x="180" y="22" width="300" height="56" rx="6" fill="#ddf1f3" stroke="#0a5660" stroke-width="1.6"/>
  <text x="330" y="46" text-anchor="middle" font-size="12" fill="#0a5660"><tspan x="330" dy="0" font-weight="600">Alternate access required</tspan><tspan x="330" dy="16" font-weight="400">from the risk grade (Figure 1)</tspan></text>
  <polygon points="330,102 480,150 330,198 180,150" fill="#fdf7e3" stroke="#bdbab0"/>
  <text x="330" y="138" text-anchor="middle" font-size="12" fill="#1a1a1a"><tspan x="330" dy="0" font-weight="400">A more accessible product</tspan><tspan x="330" dy="16" font-weight="400">meets the same need?</tspan><tspan x="330" dy="16" font-weight="400">(S3 only, including S3 provisional)</tspan></text>
  <polygon points="330,212 480,260 330,308 180,260" fill="#fdf7e3" stroke="#bdbab0"/>
  <text x="330" y="264" text-anchor="middle" font-size="12" fill="#1a1a1a"><tspan x="330" dy="0" font-weight="400">TAAP on file?</tspan></text>
  <polygon points="330,385 510,445 330,505 150,445" fill="#fdf7e3" stroke="#bdbab0"/>
  <text x="330" y="434" text-anchor="middle" font-size="11" fill="#1a1a1a"><tspan x="330" dy="0" font-weight="400">TAAP meets the minimum?</tspan><tspan x="330" dy="15" font-weight="400">pressure = Exposure rank + Breadth</tspan><tspan x="330" dy="15" font-weight="400">3 of 6 at pressure 0 or 1, 4 of 6 at 2, all 6 at 3 or more</tspan></text>
  <polygon points="330,547 480,595 330,643 180,595" fill="#fdf7e3" stroke="#bdbab0"/>
  <text x="330" y="591" text-anchor="middle" font-size="12" fill="#1a1a1a"><tspan x="330" dy="0" font-weight="400">TAAP meets none</tspan><tspan x="330" dy="16" font-weight="400">of the six?</tspan></text>
  <polygon points="330,687 480,735 330,783 180,735" fill="#fdf7e3" stroke="#bdbab0"/>
  <text x="330" y="723" text-anchor="middle" font-size="12" fill="#1a1a1a"><tspan x="330" dy="0" font-weight="400">Undue burden or</tspan><tspan x="330" dy="16" font-weight="400">fundamental alteration</tspan><tspan x="330" dy="16" font-weight="400">determination?</tspan></text>
  <rect x="25" y="905" width="150" height="60" rx="6" fill="#fbe3e4" stroke="#8c1d22" stroke-width="1.6"/>
  <text x="100" y="923" text-anchor="middle" font-size="12" fill="#8c1d22"><tspan x="100" dy="0" font-weight="600">Deny</tspan><tspan x="100" dy="16" font-weight="400">reasons, standard,</tspan><tspan x="100" dy="16" font-weight="400">path to a new review</tspan></text>
  <rect x="210" y="897" width="300" height="76" rx="6" fill="#ddf1f3" stroke="#0a5660" stroke-width="1.6"/>
  <text x="360" y="915" text-anchor="middle" font-size="12" fill="#0a5660"><tspan x="360" dy="0" font-weight="600">Approve with TAAP</tspan><tspan x="360" dy="16" font-weight="400">statement, three signers, roadmap;</tspan><tspan x="360" dy="16" font-weight="400">12-month term or until renewal;</tspan><tspan x="360" dy="16" font-weight="400">warning level from pressure and the gap</tspan></text>
  <path d="M330,78 L330,102" fill="none" stroke="#6b6b6b" stroke-width="1.4" marker-end="url(#head)"/>
  <path d="M180,150 L100,150 L100,905" fill="none" stroke="#6b6b6b" stroke-width="1.4" marker-end="url(#head)"/>
  <text x="140" y="144" text-anchor="middle" font-size="11" fill="#444444"><tspan x="140" dy="0" font-weight="400">yes</tspan></text>
  <path d="M330,198 L330,212" fill="none" stroke="#6b6b6b" stroke-width="1.4" marker-end="url(#head)"/>
  <text x="338" y="214" text-anchor="start" font-size="11" fill="#444444"><tspan x="338" dy="0" font-weight="400">no</tspan></text>
  <path d="M180,260 L218,260 L218,300" fill="none" stroke="#6b6b6b" stroke-width="1.4" marker-end="url(#head)"/>
  <text x="199" y="254" text-anchor="middle" font-size="11" fill="#444444"><tspan x="199" dy="0" font-weight="400">no</tspan></text>
  <rect x="110.5" y="300" width="215" height="76" rx="6" fill="#ecebf7" stroke="#bdbab0" stroke-width="1"/>
  <text x="218" y="319.5" text-anchor="middle" font-size="11" fill="#3b3270"><tspan x="218" dy="0" font-weight="600">Hold 4, for a TAAP</tspan><tspan x="218" dy="15" font-weight="400">Held by the requesting unit</tspan><tspan x="218" dy="15" font-weight="400">Resumes at this check with the TAAP;</tspan><tspan x="218" dy="15" font-weight="400">carries the minimum and the warning</tspan></text>
  <path d="M330,308 L330,385" fill="none" stroke="#6b6b6b" stroke-width="1.4" marker-end="url(#head)"/>
  <text x="338" y="324" text-anchor="start" font-size="11" fill="#444444"><tspan x="338" dy="0" font-weight="400">yes</tspan></text>
  <path d="M510,445 L560,445 L560,935 L510,935" fill="none" stroke="#6b6b6b" stroke-width="1.4" marker-end="url(#head)"/>
  <text x="535" y="439" text-anchor="middle" font-size="11" fill="#444444"><tspan x="535" dy="0" font-weight="400">yes</tspan></text>
  <path d="M330,505 L330,547" fill="none" stroke="#6b6b6b" stroke-width="1.4" marker-end="url(#head)"/>
  <text x="338" y="521" text-anchor="start" font-size="11" fill="#444444"><tspan x="338" dy="0" font-weight="400">no</tspan></text>
  <path d="M180,595 L100,595" fill="none" stroke="#6b6b6b" stroke-width="1.4"/>
  <text x="140" y="589" text-anchor="middle" font-size="11" fill="#444444"><tspan x="140" dy="0" font-weight="400">yes</tspan></text>
  <path d="M330,643 L330,687" fill="none" stroke="#6b6b6b" stroke-width="1.4" marker-end="url(#head)"/>
  <text x="338" y="659" text-anchor="start" font-size="11" fill="#444444"><tspan x="338" dy="0" font-weight="400">no: below the minimum</tspan></text>
  <path d="M180,735 L100,735" fill="none" stroke="#6b6b6b" stroke-width="1.4"/>
  <text x="140" y="729" text-anchor="middle" font-size="11" fill="#444444"><tspan x="140" dy="0" font-weight="400">none</tspan></text>
  <path d="M480,735 L442,735 L442,775" fill="none" stroke="#6b6b6b" stroke-width="1.4" marker-end="url(#head)"/>
  <text x="461" y="729" text-anchor="middle" font-size="11" fill="#444444"><tspan x="461" dy="0" font-weight="400">claimed</tspan></text>
  <rect x="334.5" y="775" width="215" height="91" rx="6" fill="#ecebf7" stroke="#bdbab0" stroke-width="1"/>
  <text x="442" y="794.5" text-anchor="middle" font-size="11" fill="#3b3270"><tspan x="442" dy="0" font-weight="600">Hold 5, for a written determination</tspan><tspan x="442" dy="15" font-weight="400">Held by the president or a designee</tspan><tspan x="442" dy="15" font-weight="400">with budget authority</tspan><tspan x="442" dy="15" font-weight="400">Resumes at this check</tspan><tspan x="442" dy="15" font-weight="400">with the determination</tspan></text>
  <path d="M330,783 L330,897" fill="none" stroke="#6b6b6b" stroke-width="1.4" marker-end="url(#head)"/>
  <text x="322" y="803.5" text-anchor="end" font-size="11" fill="#444444"><tspan x="322" dy="0" font-weight="400">on file:</tspan><tspan x="322" dy="15" font-weight="400">high warning</tspan></text>
</svg>
