<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1030" width="900" height="1030" role="img" aria-labelledby="t d" font-family="Segoe UI, system-ui, -apple-system, Helvetica, Arial, sans-serif">
  <title id="t">Review process, part 1: the shared checks</title>
  <desc id="d">From requisition intake through the evidence, Exposure and Veracity checks to the risk grade. An accommodation purchase is approved at intake. The Veracity floor binds every grade at high exposure, and at low and medium a grade that rests on the vendor's denials; at low and medium a grade on the barriers found proceeds at any level with the standard provisional. Holds 1 to 3 pause the review, hold 3 resumes at the Severity step, and the fallback joins the S3 path when the ATI review team records that the evidence cannot be raised. With no evidence at all, the review re-enters at the Exposure step and falls back the same way.</desc>
  <defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b6b6b"/></marker></defs>
  <rect width="900" height="1030" fill="#ffffff"/>
  
  <rect x="100" y="22" width="300" height="56" rx="28" fill="#f0efe9" stroke="#bdbab0" stroke-width="1"/>
  <text x="250" y="45.5" text-anchor="middle" font-size="13" fill="#1a1a1a"><tspan x="250" dy="0" font-weight="600">Requisition intake</tspan><tspan x="250" dy="17" font-weight="400">exposure answers, findings, evidence on file</tspan></text>
  <polygon points="250,92 400,140 250,188 100,140" fill="#fdf7e3" stroke="#bdbab0"/>
  <text x="250" y="135.5" text-anchor="middle" font-size="13" fill="#1a1a1a"><tspan x="250" dy="0" font-weight="400">Purchased as an accommodation</tspan><tspan x="250" dy="17" font-weight="400">for one named person?</tspan></text>
  <rect x="495" y="112" width="270" height="56" rx="6" fill="#e3f4e8" stroke="#14612d" stroke-width="1.6"/>
  <text x="630" y="136" text-anchor="middle" font-size="12" fill="#14612d"><tspan x="630" dy="0" font-weight="600">Approve at intake</tspan><tspan x="630" dy="16" font-weight="400">limited to the accommodation; nothing rated</tspan></text>
  <polygon points="250,192 400,240 250,288 100,240" fill="#fdf7e3" stroke="#bdbab0"/>
  <text x="250" y="235.5" text-anchor="middle" font-size="13" fill="#1a1a1a"><tspan x="250" dy="0" font-weight="400">Findings or accessibility</tspan><tspan x="250" dy="17" font-weight="400">evidence on file?</tspan></text>
  <rect x="100" y="312" width="300" height="56" rx="6" fill="#ffffff" stroke="#bdbab0" stroke-width="1"/>
  <text x="250" y="335.5" text-anchor="middle" font-size="13" fill="#1a1a1a"><tspan x="250" dy="0" font-weight="600">Rate Exposure</tspan><tspan x="250" dy="17" font-weight="400">users start it; answers lower; floors raise</tspan></text>
  <polygon points="250,387 400,435 250,483 100,435" fill="#fdf7e3" stroke="#bdbab0"/>
  <text x="250" y="430.5" text-anchor="middle" font-size="13" fill="#1a1a1a"><tspan x="250" dy="0" font-weight="400">User count</tspan><tspan x="250" dy="17" font-weight="400">missing?</tspan></text>
  <rect x="100" y="499" width="300" height="72" rx="6" fill="#ffffff" stroke="#bdbab0" stroke-width="1"/>
  <text x="250" y="524" text-anchor="middle" font-size="11" fill="#1a1a1a"><tspan x="250" dy="0" font-weight="600">Rate Severity from the findings, as a minimum</tspan><tspan x="250" dy="15" font-weight="400">task impact of the worst barrier, never the ACR label</tspan><tspan x="250" dy="15" font-weight="400">3 S2 on one pair, or 6 pairs at high Exposure, rate S3</tspan></text>
  <polygon points="250,595 400,645 250,695 100,645" fill="#fdf7e3" stroke="#bdbab0"/>
  <text x="250" y="626.5" text-anchor="middle" font-size="11" fill="#1a1a1a"><tspan x="250" dy="0" font-weight="400">Vendor denials at the Veracity floor?</tspan><tspan x="250" dy="15" font-weight="400">any at low; E1+, taken at face value, at medium and high;</tspan><tspan x="250" dy="15" font-weight="400">binds every grade at high, and at low and medium</tspan><tspan x="250" dy="15" font-weight="400">a grade on the barriers found proceeds</tspan></text>
  <rect x="100" y="819" width="300" height="72" rx="6" fill="#ffffff" stroke="#bdbab0" stroke-width="1"/>
  <text x="250" y="844" text-anchor="middle" font-size="11" fill="#1a1a1a"><tspan x="250" dy="0" font-weight="600">Risk grade</tspan><tspan x="250" dy="15" font-weight="400">from the Exposure level and the Severity</tspan><tspan x="250" dy="15" font-weight="400">Breadth (0 to 2) is rated here for the TAAP standard</tspan></text>
  <rect x="100" y="940" width="300" height="60" rx="6" fill="#e3f4e8" stroke="#14612d" stroke-width="1.6"/>
  <text x="250" y="966" text-anchor="middle" font-size="12" fill="#14612d"><tspan x="250" dy="0" font-weight="600">No alternate access required</tspan><tspan x="250" dy="16" font-weight="400">S0 and S1 at every Exposure; S2 at low</tspan></text>
  <rect x="495" y="940" width="270" height="60" rx="6" fill="#ddf1f3" stroke="#0a5660" stroke-width="1.6"/>
  <text x="630" y="958" text-anchor="middle" font-size="12" fill="#0a5660"><tspan x="630" dy="0" font-weight="600">Alternate access required</tspan><tspan x="630" dy="16" font-weight="400">S2 at medium or high; S3; standard</tspan><tspan x="630" dy="16" font-weight="400">provisional below the floor. Figure 2</tspan></text>
  <rect x="495" y="212" width="270" height="56" rx="6" fill="#ecebf7" stroke="#bdbab0" stroke-width="1"/>
  <text x="630" y="236" text-anchor="middle" font-size="12" fill="#3b3270"><tspan x="630" dy="0" font-weight="600">Hold 1, for accessibility evidence</tspan><tspan x="630" dy="16" font-weight="400">Held by the requester</tspan></text>
  <rect x="495" y="407" width="270" height="56" rx="6" fill="#ecebf7" stroke="#bdbab0" stroke-width="1"/>
  <text x="630" y="431" text-anchor="middle" font-size="12" fill="#3b3270"><tspan x="630" dy="0" font-weight="600">Hold 2, for exposure answers</tspan><tspan x="630" dy="16" font-weight="400">Held by the requester</tspan></text>
  <rect x="495" y="507" width="270" height="56" rx="6" fill="#ecebf7" stroke="#bdbab0" stroke-width="1"/>
  <text x="630" y="531" text-anchor="middle" font-size="12" fill="#3b3270"><tspan x="630" dy="0" font-weight="600">Hold 3, for stronger evidence</tspan><tspan x="630" dy="16" font-weight="400">Held by the ATI review team</tspan></text>
  <polygon points="630,595 780,645 630,695 480,645" fill="#fdf7e3" stroke="#bdbab0"/>
  <text x="630" y="626.5" text-anchor="middle" font-size="11" fill="#1a1a1a"><tspan x="630" dy="0" font-weight="400">Can the evidence be raised?</tspan><tspan x="630" dy="15" font-weight="400">a spot check of a clean ACR, a corrected or accepted ACR,</tspan><tspan x="630" dy="15" font-weight="400">a demonstration or a full manual review;</tspan><tspan x="630" dy="15" font-weight="400">the ATI review team records a no</tspan></text>
  <rect x="495" y="727" width="270" height="56" rx="6" fill="#ffffff" stroke="#bdbab0" stroke-width="1"/>
  <text x="630" y="744" text-anchor="middle" font-size="11" fill="#1a1a1a"><tspan x="630" dy="0" font-weight="600">Fallback: S3 (provisional)</tspan><tspan x="630" dy="15" font-weight="400">barriers found as a minimum; Breadth as found,</tspan><tspan x="630" dy="15" font-weight="400">or 2 with no evidence at all</tspan></text>
  <path d="M250,78 L250,92" fill="none" stroke="#6b6b6b" stroke-width="1.4" marker-end="url(#head)"/>
  <path d="M400,140 L495,140" fill="none" stroke="#6b6b6b" stroke-width="1.4" marker-end="url(#head)"/>
  <text x="447.5" y="134" text-anchor="middle" font-size="11" fill="#444444"><tspan x="447.5" dy="0" font-weight="400">yes</tspan></text>
  <path d="M250,188 L250,192" fill="none" stroke="#6b6b6b" stroke-width="1.4" marker-end="url(#head)"/>
  <text x="258" y="204" text-anchor="start" font-size="11" fill="#444444"><tspan x="258" dy="0" font-weight="400">no</tspan></text>
  <path d="M400,240 L495,240" fill="none" stroke="#6b6b6b" stroke-width="1.4" marker-end="url(#head)"/>
  <text x="447.5" y="234" text-anchor="middle" font-size="11" fill="#444444"><tspan x="447.5" dy="0" font-weight="400">no</tspan></text>
  <path d="M250,288 L250,312" fill="none" stroke="#6b6b6b" stroke-width="1.4" marker-end="url(#head)"/>
  <text x="258" y="304" text-anchor="start" font-size="11" fill="#444444"><tspan x="258" dy="0" font-weight="400">yes</tspan></text>
  <path d="M250,368 L250,387" fill="none" stroke="#6b6b6b" stroke-width="1.4" marker-end="url(#head)"/>
  <path d="M400,435 L495,435" fill="none" stroke="#6b6b6b" stroke-width="1.4" marker-end="url(#head)"/>
  <text x="447.5" y="429" text-anchor="middle" font-size="11" fill="#444444"><tspan x="447.5" dy="0" font-weight="400">yes</tspan></text>
  <path d="M250,483 L250,499" fill="none" stroke="#6b6b6b" stroke-width="1.4" marker-end="url(#head)"/>
  <text x="258" y="499" text-anchor="start" font-size="11" fill="#444444"><tspan x="258" dy="0" font-weight="400">no</tspan></text>
  <path d="M250,571 L250,595" fill="none" stroke="#6b6b6b" stroke-width="1.4" marker-end="url(#head)"/>
  <path d="M400,645 L480,645" fill="none" stroke="#6b6b6b" stroke-width="1.4" marker-end="url(#head)"/>
  <text x="440" y="639" text-anchor="middle" font-size="11" fill="#444444"><tspan x="440" dy="0" font-weight="400">no</tspan></text>
  <path d="M630,595 L630,571" fill="none" stroke="#6b6b6b" stroke-width="1.4" marker-end="url(#head)"/>
  <text x="640" y="587" text-anchor="start" font-size="11" fill="#444444"><tspan x="640" dy="0" font-weight="400">yes</tspan></text>
  <path d="M495,535 L400,535" fill="none" stroke="#6b6b6b" stroke-width="1.4" marker-end="url(#head)"/>
  <text x="447.5" y="550" text-anchor="middle" font-size="10" fill="#444444"><tspan x="447.5" dy="0" font-weight="400">resumes with</tspan><tspan x="447.5" dy="14" font-weight="400">the new findings</tspan></text>
  <path d="M630,268 L630,340 L400,340" fill="none" stroke="#6b6b6b" stroke-width="1.4" marker-end="url(#head)"/>
  <text x="638" y="276.5" text-anchor="start" font-size="11" fill="#444444"><tspan x="638" dy="0" font-weight="400">no evidence can be obtained:</tspan><tspan x="638" dy="15" font-weight="400">the fallback follows</tspan></text>
  <path d="M630,695 L630,727" fill="none" stroke="#6b6b6b" stroke-width="1.4" marker-end="url(#head)"/>
  <text x="638" y="711" text-anchor="start" font-size="11" fill="#444444"><tspan x="638" dy="0" font-weight="400">no</tspan></text>
  <path d="M630,783 L630,807 L250,807" fill="none" stroke="#6b6b6b" stroke-width="1.4"/>
  <path d="M250,695 L250,819" fill="none" stroke="#6b6b6b" stroke-width="1.4" marker-end="url(#head)"/>
  <text x="258" y="711" text-anchor="start" font-size="11" fill="#444444"><tspan x="258" dy="0" font-weight="400">yes</tspan></text>
  <path d="M250,891 L250,940" fill="none" stroke="#6b6b6b" stroke-width="1.4" marker-end="url(#head)"/>
  <text x="258" y="907" text-anchor="start" font-size="11" fill="#444444"><tspan x="258" dy="0" font-weight="400">No alternate access required</tspan></text>
  <path d="M400,855 L630,855 L630,940" fill="none" stroke="#6b6b6b" stroke-width="1.4" marker-end="url(#head)"/>
  <text x="515" y="849" text-anchor="middle" font-size="11" fill="#444444"><tspan x="515" dy="0" font-weight="400">Alternate access required</tspan></text>
</svg>
