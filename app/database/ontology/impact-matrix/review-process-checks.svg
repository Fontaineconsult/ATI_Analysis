<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 925" width="820" height="925" role="img" aria-labelledby="t d" font-family="Segoe UI, system-ui, -apple-system, Helvetica, Arial, sans-serif">
  <title id="t">Review process, part 1: the shared checks</title>
  <desc id="d">From requisition intake through the evidence, Exposure and Veracity checks to the risk grade. Routes 1 to 3 hold the review, route 3 loops back to the Severity step, and the fallback joins the S3 path when the evidence cannot be raised.</desc>
  <defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b6b6b"/></marker></defs>
  <rect width="820" height="925" fill="#ffffff"/>
  
  <rect x="100" y="22" width="300" height="56" rx="28" fill="#f0efe9" stroke="#bdbab0" stroke-width="1"/>
  <text x="250" y="45.5" text-anchor="middle" font-size="13" fill="#1a1a1a"><tspan x="250" dy="0" font-weight="600">Requisition intake</tspan><tspan x="250" dy="17" font-weight="400">exposure answers, findings, evidence on file</tspan></text>
  <polygon points="250,92 400,140 250,188 100,140" fill="#fdf7e3" stroke="#bdbab0"/>
  <text x="250" y="135.5" text-anchor="middle" font-size="13" fill="#1a1a1a"><tspan x="250" dy="0" font-weight="400">Accessibility evidence</tspan><tspan x="250" dy="17" font-weight="400">on file?</tspan></text>
  <rect x="100" y="212" width="300" height="56" rx="6" fill="#ffffff" stroke="#bdbab0" stroke-width="1"/>
  <text x="250" y="235.5" text-anchor="middle" font-size="13" fill="#1a1a1a"><tspan x="250" dy="0" font-weight="600">Rate Exposure</tspan><tspan x="250" dy="17" font-weight="400">floors and answers; unknown answers map to high</tspan></text>
  <polygon points="250,287 400,335 250,383 100,335" fill="#fdf7e3" stroke="#bdbab0"/>
  <text x="250" y="330.5" text-anchor="middle" font-size="13" fill="#1a1a1a"><tspan x="250" dy="0" font-weight="400">Unknown answers raise</tspan><tspan x="250" dy="17" font-weight="400">the Exposure level?</tspan></text>
  <rect x="100" y="405" width="300" height="60" rx="6" fill="#ffffff" stroke="#bdbab0" stroke-width="1"/>
  <text x="250" y="431" text-anchor="middle" font-size="12" fill="#1a1a1a"><tspan x="250" dy="0" font-weight="600">Rate Severity from the findings, as a minimum</tspan><tspan x="250" dy="16" font-weight="400">task impact of the worst barrier, never the ACR label</tspan></text>
  <polygon points="250,490 400,540 250,590 100,540" fill="#fdf7e3" stroke="#bdbab0"/>
  <text x="250" y="528" text-anchor="middle" font-size="12" fill="#1a1a1a"><tspan x="250" dy="0" font-weight="400">Evidence at the Veracity floor</tspan><tspan x="250" dy="16" font-weight="400">for this Exposure and Severity?</tspan><tspan x="250" dy="16" font-weight="400">(S1 always E2 or better)</tspan></text>
  <rect x="100" y="720" width="300" height="60" rx="6" fill="#ffffff" stroke="#bdbab0" stroke-width="1"/>
  <text x="250" y="745.5" text-anchor="middle" font-size="13" fill="#1a1a1a"><tspan x="250" dy="0" font-weight="600">Risk grade</tspan><tspan x="250" dy="17" font-weight="400">from the Exposure level and the Severity</tspan></text>
  <rect x="100" y="835" width="300" height="60" rx="6" fill="#e3f4e8" stroke="#14612d" stroke-width="1.6"/>
  <text x="250" y="861" text-anchor="middle" font-size="12" fill="#14612d"><tspan x="250" dy="0" font-weight="600">Approve</tspan><tspan x="250" dy="16" font-weight="400">S0 and S1 at every Exposure; S2 at low</tspan></text>
  <rect x="495" y="835" width="270" height="60" rx="6" fill="#ddf1f3" stroke="#0a5660" stroke-width="1.6"/>
  <text x="630" y="853" text-anchor="middle" font-size="12" fill="#0a5660"><tspan x="630" dy="0" font-weight="600">Needs TAAP</tspan><tspan x="630" dy="16" font-weight="400">S2 at medium or high; S3</tspan><tspan x="630" dy="16" font-weight="400">continues in Figure 2</tspan></text>
  <rect x="495" y="104" width="270" height="72" rx="6" fill="#ecebf7" stroke="#bdbab0" stroke-width="1"/>
  <text x="630" y="128" text-anchor="middle" font-size="12" fill="#3b3270"><tspan x="630" dy="0" font-weight="600">Route 1. On hold:</tspan><tspan x="630" dy="16" font-weight="400">accessibility evidence needed</tspan><tspan x="630" dy="16" font-weight="400">Held by the requesting unit</tspan></text>
  <rect x="495" y="299" width="270" height="72" rx="6" fill="#ecebf7" stroke="#bdbab0" stroke-width="1"/>
  <text x="630" y="323" text-anchor="middle" font-size="12" fill="#3b3270"><tspan x="630" dy="0" font-weight="600">Route 2. On hold:</tspan><tspan x="630" dy="16" font-weight="400">more information needed</tspan><tspan x="630" dy="16" font-weight="400">Held by the requesting unit</tspan></text>
  <rect x="495" y="399" width="270" height="72" rx="6" fill="#ecebf7" stroke="#bdbab0" stroke-width="1"/>
  <text x="630" y="423" text-anchor="middle" font-size="12" fill="#3b3270"><tspan x="630" dy="0" font-weight="600">Route 3. Manual review:</tspan><tspan x="630" dy="16" font-weight="400">stronger evidence needed</tspan><tspan x="630" dy="16" font-weight="400">Held by the ATI review team</tspan></text>
  <polygon points="630,492 780,540 630,588 480,540" fill="#fdf7e3" stroke="#bdbab0"/>
  <text x="630" y="536" text-anchor="middle" font-size="12" fill="#1a1a1a"><tspan x="630" dy="0" font-weight="400">Can the evidence be raised?</tspan><tspan x="630" dy="16" font-weight="400">a demonstration, or ATI testing</tspan></text>
  <rect x="495" y="622" width="270" height="56" rx="6" fill="#ffffff" stroke="#bdbab0" stroke-width="1"/>
  <text x="630" y="639" text-anchor="middle" font-size="11" fill="#1a1a1a"><tspan x="630" dy="0" font-weight="600">Fallback: S3 (provisional)</tspan><tspan x="630" dy="15" font-weight="400">barriers found as a minimum; Breadth as found,</tspan><tspan x="630" dy="15" font-weight="400">or 2 with no evidence at all</tspan></text>
  <path d="M250,78 L250,92" fill="none" stroke="#6b6b6b" stroke-width="1.4" marker-end="url(#head)"/>
  <path d="M400,140 L495,140" fill="none" stroke="#6b6b6b" stroke-width="1.4" marker-end="url(#head)"/>
  <text x="447.5" y="134" text-anchor="middle" font-size="11" fill="#444444"><tspan x="447.5" dy="0" font-weight="400">no</tspan></text>
  <path d="M250,188 L250,212" fill="none" stroke="#6b6b6b" stroke-width="1.4" marker-end="url(#head)"/>
  <text x="258" y="204" text-anchor="start" font-size="11" fill="#444444"><tspan x="258" dy="0" font-weight="400">yes</tspan></text>
  <path d="M250,268 L250,287" fill="none" stroke="#6b6b6b" stroke-width="1.4" marker-end="url(#head)"/>
  <path d="M400,335 L495,335" fill="none" stroke="#6b6b6b" stroke-width="1.4" marker-end="url(#head)"/>
  <text x="447.5" y="329" text-anchor="middle" font-size="11" fill="#444444"><tspan x="447.5" dy="0" font-weight="400">yes</tspan></text>
  <path d="M250,383 L250,405" fill="none" stroke="#6b6b6b" stroke-width="1.4" marker-end="url(#head)"/>
  <text x="258" y="399" text-anchor="start" font-size="11" fill="#444444"><tspan x="258" dy="0" font-weight="400">no</tspan></text>
  <path d="M250,465 L250,490" fill="none" stroke="#6b6b6b" stroke-width="1.4" marker-end="url(#head)"/>
  <path d="M400,540 L480,540" fill="none" stroke="#6b6b6b" stroke-width="1.4" marker-end="url(#head)"/>
  <text x="440" y="534" text-anchor="middle" font-size="11" fill="#444444"><tspan x="440" dy="0" font-weight="400">no</tspan></text>
  <path d="M630,492 L630,471" fill="none" stroke="#6b6b6b" stroke-width="1.4" marker-end="url(#head)"/>
  <text x="640" y="484" text-anchor="start" font-size="11" fill="#444444"><tspan x="640" dy="0" font-weight="400">yes</tspan></text>
  <path d="M495,435 L400,435" fill="none" stroke="#6b6b6b" stroke-width="1.4" marker-end="url(#head)"/>
  <text x="447.5" y="450" text-anchor="middle" font-size="10" fill="#444444"><tspan x="447.5" dy="0" font-weight="400">resumes with</tspan><tspan x="447.5" dy="14" font-weight="400">the new findings</tspan></text>
  <path d="M630,588 L630,622" fill="none" stroke="#6b6b6b" stroke-width="1.4" marker-end="url(#head)"/>
  <text x="638" y="604" text-anchor="start" font-size="11" fill="#444444"><tspan x="638" dy="0" font-weight="400">no</tspan></text>
  <path d="M630,678 L630,705 L250,705" fill="none" stroke="#6b6b6b" stroke-width="1.4"/>
  <path d="M250,590 L250,720" fill="none" stroke="#6b6b6b" stroke-width="1.4" marker-end="url(#head)"/>
  <text x="258" y="606" text-anchor="start" font-size="11" fill="#444444"><tspan x="258" dy="0" font-weight="400">yes</tspan></text>
  <path d="M250,780 L250,835" fill="none" stroke="#6b6b6b" stroke-width="1.4" marker-end="url(#head)"/>
  <text x="258" y="796" text-anchor="start" font-size="11" fill="#444444"><tspan x="258" dy="0" font-weight="400">Approve</tspan></text>
  <path d="M400,750 L630,750 L630,835" fill="none" stroke="#6b6b6b" stroke-width="1.4" marker-end="url(#head)"/>
  <text x="515" y="744" text-anchor="middle" font-size="11" fill="#444444"><tspan x="515" dy="0" font-weight="400">Needs TAAP</tspan></text>
</svg>
