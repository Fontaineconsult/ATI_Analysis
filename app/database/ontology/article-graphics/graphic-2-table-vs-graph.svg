<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" font-family="Roboto, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">The same facts, stored two ways</title>
  <desc id="d">A spreadsheet keeps links as prose in a notes column; a graph stores each link as a typed record that a query can follow.</desc>
  <defs>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L9,5 L0,10 z" fill="#4A5568"/></marker>
    <style>
      .h1   { fill:#202C4A; font-size:24px; font-weight:700; }
      .sub  { fill:#4A5568; font-size:13px; }
      .boxT { font-size:15px; font-weight:700; }
      .boxS { font-size:11px; }
      .rel  { fill:#4A5568; font-size:12px; font-style:italic; }
      .relS { fill:#4A5568; font-size:10.5px; font-style:italic; }
      .lab  { fill:#5A6B8C; font-size:11.5px; font-weight:600; letter-spacing:0.04em; }
      .foot { fill:#718096; font-size:12.5px; }
      .edge { stroke:#4A5568; stroke-width:1.8; fill:none; }
</style>
  </defs>
  <rect width="1200" height="675" fill="#ffffff"/>
  <text class="h1" x="32" y="46">The same facts, stored two ways</text>
  <rect x="32" y="58" width="80" height="4" rx="2" fill="#4966A4"/>
  <rect x="112" y="58" width="40" height="4" rx="2" fill="#635098"/>
  <rect x="152" y="58" width="40" height="4" rx="2" fill="#DB5850"/>
  <text class="sub" x="32" y="84">A table keeps rows about single things; the links survive only as prose. A graph stores the links as records.</text>
<text x="64" y="132" font-size="15px" font-weight="700" fill="#202C4A">The table</text>
<rect x="64" y="150" width="488" height="34" fill="#F7FAFC" stroke="#E2E8F0"/>
<text x="74" y="172" font-size="11.5px" font-weight="700" fill="#4A5568">Indicator</text>
<text x="186" y="172" font-size="11.5px" font-weight="700" fill="#4A5568">Status</text>
<text x="298" y="172" font-size="11.5px" font-weight="700" fill="#4A5568">Notes</text>
<rect x="64" y="184" width="488" height="62" fill="#ffffff" stroke="#E2E8F0"/>
<text x="74" y="210" font-size="11.5px" fill="#202C4A">7.11-ins</text>
<text x="186" y="210" font-size="11.5px" fill="#202C4A">Established</text>
<text x="298" y="203" font-size="10px" fill="#718096">Library procedure updated — see Dean</text>
<text x="298" y="218" font-size="10px" fill="#718096">R. Calloway. Doc on Box (M. Ibarra has</text>
<text x="298" y="233" font-size="10px" fill="#718096">the link). Alma feed OK.</text>
<rect x="64" y="246" width="488" height="62" fill="#ffffff" stroke="#E2E8F0"/>
<text x="74" y="272" font-size="11.5px" fill="#202C4A">5.11-ins</text>
<text x="186" y="272" font-size="11.5px" fill="#202C4A">Initiated</text>
<text x="298" y="265" font-size="10px" fill="#718096">Captioning — waiting on vendor pick.</text>
<text x="298" y="280" font-size="10px" fill="#718096">J. Okada to train DPRC staff; same</text>
<text x="298" y="295" font-size="10px" fill="#718096">folks as the 7.11 row.</text>
<rect x="64" y="308" width="488" height="62" fill="#ffffff" stroke="#E2E8F0"/>
<text x="74" y="334" font-size="11.5px" fill="#202C4A">6.8-ins</text>
<text x="186" y="334" font-size="11.5px" fill="#202C4A">Established</text>
<text x="298" y="327" font-size="10px" fill="#718096">Canvas remediation ongoing — student</text>
<text x="298" y="342" font-size="10px" fill="#718096">team, UDOIT scores in T. Marsh’s</text>
<text x="298" y="357" font-size="10px" fill="#718096">spreadsheet (ask him for access).</text>
<line x1="176" y1="150" x2="176" y2="370" stroke="#E2E8F0" stroke-width="1"/>
<line x1="288" y1="150" x2="288" y2="370" stroke="#E2E8F0" stroke-width="1"/>
<text x="64" y="406" font-size="12.5px" font-style="italic" fill="#718096">The same people and systems appear again and again — as text.</text>
<text x="64" y="425" font-size="12.5px" font-style="italic" fill="#718096">A mention is not a connection. You cannot query a mention.</text>
<line x1="600" y1="116" x2="600" y2="608" stroke="#E2E8F0" stroke-width="1.6" stroke-dasharray="4 6"/>
<text x="644" y="132" font-size="15px" font-weight="700" fill="#202C4A">The graph</text>
<rect x="644" y="156" width="168" height="76" rx="10" fill="#E6F4EC" stroke="#38A169" stroke-width="1.8"/><text x="728.0" y="192" text-anchor="middle" font-size="14px" font-weight="700" fill="#22543D">Indicator 7.11</text><text x="728.0" y="209" text-anchor="middle" font-size="11px" fill="#4E8E6A">success indicator</text>
<rect x="920" y="156" width="220" height="76" rx="10" fill="#FAF0DC" stroke="#B7791F" stroke-width="1.8"/><text x="1030.0" y="192" text-anchor="middle" font-size="14px" font-weight="700" fill="#744210">Evidence record</text><text x="1030.0" y="209" text-anchor="middle" font-size="11px" fill="#9C7B3A">2025–2026 · Established</text>
<rect x="920" y="306" width="220" height="76" rx="10" fill="#EFEAFB" stroke="#805AD5" stroke-width="1.8"/><text x="1030.0" y="342" text-anchor="middle" font-size="14px" font-weight="700" fill="#44337A">E-resource acquisition</text><text x="1030.0" y="359" text-anchor="middle" font-size="11px" fill="#7A68B0">procedure</text>
<rect x="920" y="456" width="220" height="76" rx="10" fill="#E0F3F7" stroke="#0987A0" stroke-width="1.8"/><text x="1030.0" y="492" text-anchor="middle" font-size="14px" font-weight="700" fill="#086F83">Procedure document</text><text x="1030.0" y="509" text-anchor="middle" font-size="11px" fill="#4993A3">on file</text>
<rect x="644" y="306" width="168" height="76" rx="10" fill="#E0F3F7" stroke="#0987A0" stroke-width="1.8"/><text x="728.0" y="334" text-anchor="middle" font-size="13.5px" font-weight="700" fill="#086F83">Dean R. Calloway</text><text x="728.0" y="352" text-anchor="middle" font-size="11px" fill="#4993A3">member_of_community ·</text><text x="728.0" y="366" text-anchor="middle" font-size="11px" fill="#4993A3">Library</text>
<path class="edge" d="M918 194 L815 194" marker-end="url(#ar)"/><text class="rel" x="866" y="185" text-anchor="middle">tracks</text>
<path class="edge" d="M1030 304 L1030 236" marker-end="url(#ar)"/><text class="rel" x="1040" y="276" text-anchor="start">is_evidence_for</text>
<path class="edge" d="M1030 384 L1030 452" marker-end="url(#ar)"/><text class="rel" x="1040" y="422" text-anchor="start">is_documented_by</text>
<path class="edge" d="M814 344 L917 344" marker-end="url(#ar)"/><text class="rel" x="866" y="335" text-anchor="middle">worked_on</text>
<text x="644" y="580" font-size="12.5px" font-style="italic" fill="#718096">Every link is a record: typed, dated, queryable — and followable in one step.</text>
</svg>