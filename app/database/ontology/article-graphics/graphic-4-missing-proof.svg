<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" font-family="Roboto, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">The same chain, with the proof missing</title>
  <desc id="d">The evidence chain with the final document absent. The status still reads Established; only the stored links reveal the gap, and one query returns every claim shaped like this.</desc>
