<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" font-family="Roboto, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Three years on one indicator</title>
  <desc id="d">One shared success indicator with three years of evidence records. Closed years keep their documents and notes; the new year starts as a stub and accumulates.</desc>
  <defs>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L9,5 L0,10 z" fill="#4A5568"/></marker>
    <style>
      .h1   { fill:#202C4A; font-size:24px; font-weight:700; }
      .sub  { fill:#4A5568; font-size:13px; }
      .boxT { font-size:15px; font-weight:700; }
      .boxS { font-size:11px; }
      .rel  { fill:#4A5568; font-size:12px; font-style:italic; }
      .relS { fill:#4A5568; font-size:10.5px; font-style:italic; }
      .lab  { fill:#5A6B8C; font-size:11.5px; font-weight:600; letter-spacing:0.04em; }
      .foot { fill:#718096; font-size:12.5px; }
      .edge { stroke:#4A5568; stroke-width:1.8; fill:none; }
</style>
  </defs>
  <rect width="1200" height="675" fill="#ffffff"/>
  <text class="h1" x="32" y="46">Three years on one indicator</text>
  <rect x="32" y="58" width="80" height="4" rx="2" fill="#4966A4"/>
  <rect x="112" y="58" width="40" height="4" rx="2" fill="#635098"/>
  <rect x="152" y="58" width="40" height="4" rx="2" fill="#DB5850"/>
  <text class="sub" x="32" y="84">Evidence accumulates against the year; history closes and stays on the shelf</text>
<rect x="40" y="292" width="204" height="112" rx="10" fill="#E6F4EC" stroke="#38A169" stroke-width="1.8"/><text x="142.0" y="331" text-anchor="middle" font-size="15px" font-weight="700" fill="#22543D">Indicator 7.11</text><text x="142.0" y="348" text-anchor="middle" font-size="11px" fill="#4E8E6A">accessibility of</text><text x="142.0" y="363" text-anchor="middle" font-size="11px" fill="#4E8E6A">library assets</text><text x="142.0" y="378" text-anchor="middle" font-size="11px" fill="#4E8E6A">shared · year-agnostic</text>
<g opacity="0.55">
<rect x="328" y="146" width="254" height="34" rx="17" fill="#FAF0DC" stroke="#B7791F" stroke-width="1.6"/>
<text x="455" y="168" text-anchor="middle" font-size="13px" font-weight="700" fill="#202C4A">2024–2025 · <tspan fill="#744210">closed</tspan></text>
<rect x="344" y="206" width="222" height="78" rx="10" fill="#FAF0DC" stroke="#B7791F" stroke-width="1.8"/><text x="455.0" y="243" text-anchor="middle" font-size="14px" font-weight="700" fill="#744210">Evidence record</text><text x="455.0" y="260" text-anchor="middle" font-size="11px" fill="#9C7B3A">status_is · Initiated</text>
<rect x="344" y="302" width="222" height="27" rx="6" fill="#ffffff" stroke="#E2E8F0"/>
<text x="355" y="320" font-size="10.5px" fill="#4A5568">procedure v1</text>
<rect x="344" y="335" width="222" height="27" rx="6" fill="#ffffff" stroke="#E2E8F0"/>
<text x="355" y="353" font-size="10.5px" fill="#4A5568">2 documents · 3 notes</text>
<rect x="344" y="368" width="222" height="27" rx="6" fill="#ffffff" stroke="#E2E8F0"/>
<text x="355" y="386" font-size="10.5px" fill="#4A5568">status carried forward</text>
</g>
<path class="edge" d="M455 204 L455 198 L280 198 L280 376 L250 376" marker-end="url(#ar)"/>
<g opacity="0.78">
<rect x="618" y="146" width="254" height="34" rx="17" fill="#FAF0DC" stroke="#B7791F" stroke-width="1.6"/>
<text x="745" y="168" text-anchor="middle" font-size="13px" font-weight="700" fill="#202C4A">2025–2026 · <tspan fill="#744210">closed</tspan></text>
<rect x="634" y="206" width="222" height="78" rx="10" fill="#FAF0DC" stroke="#B7791F" stroke-width="1.8"/><text x="745.0" y="243" text-anchor="middle" font-size="14px" font-weight="700" fill="#744210">Evidence record</text><text x="745.0" y="260" text-anchor="middle" font-size="11px" fill="#9C7B3A">status_is · Initiated</text>
<rect x="634" y="302" width="222" height="27" rx="6" fill="#ffffff" stroke="#E2E8F0"/>
<text x="645" y="320" font-size="10.5px" fill="#4A5568">procedure v1 · carried</text>
<rect x="634" y="335" width="222" height="27" rx="6" fill="#ffffff" stroke="#E2E8F0"/>
<text x="645" y="353" font-size="10.5px" fill="#4A5568">captioning project note</text>
<rect x="634" y="368" width="222" height="27" rx="6" fill="#ffffff" stroke="#E2E8F0"/>
<text x="645" y="386" font-size="10.5px" fill="#4A5568">4 documents · 5 notes</text>
</g>
<path class="edge" d="M745 204 L745 193 L268 193 L268 346 L250 346" marker-end="url(#ar)"/>
<g opacity="1.0">
<rect x="908" y="146" width="254" height="34" rx="17" fill="#FAF0DC" stroke="#B7791F" stroke-width="1.6"/>
<text x="1035" y="168" text-anchor="middle" font-size="13px" font-weight="700" fill="#202C4A">2026–2027 · <tspan fill="#744210">open</tspan></text>
<rect x="924" y="206" width="222" height="78" rx="10" fill="#FAF0DC" stroke="#B7791F" stroke-width="1.8"/><text x="1035.0" y="243" text-anchor="middle" font-size="14px" font-weight="700" fill="#744210">Evidence record</text><text x="1035.0" y="260" text-anchor="middle" font-size="11px" fill="#9C7B3A">status_is · Not Started</text>
<rect x="924" y="302" width="222" height="27" rx="6" fill="#ffffff" stroke="#E2E8F0"/>
<text x="935" y="320" font-size="10.5px" fill="#4A5568">stub created at rollover</text>
<rect x="924" y="335" width="222" height="27" rx="6" fill="#ffffff" stroke="#E2E8F0"/>
<text x="935" y="353" font-size="10.5px" fill="#4A5568">living context carried</text>
<rect x="924" y="368" width="222" height="27" rx="6" fill="#ffffff" stroke="#E2E8F0"/>
<text x="935" y="386" font-size="10.5px" fill="#4A5568">retired work stayed behind</text>
</g>
<path class="edge" d="M1035 204 L1035 188 L256 188 L256 316 L250 316" marker-end="url(#ar)"/>
<text class="rel" x="290" y="178" text-anchor="middle">tracks</text>
<text class="foot" x="32" y="640">Nothing is overwritten. Each year <tspan font-weight="700" fill="#744210">closes like a book and stays on the shelf</tspan> — the rollover copies the living context forward and lets the dead rest.</text>
</svg>