# Curation decisions for the 2026-10-07 import of the SFBRN "Completed TAAPs" folder.
#
# The parser reads what the form says. Everything here is a judgment the form does not
# state outright, recorded so the import is reproducible and so a later reader can see
# which facts were inferred. Keys are the plan's file stem (the .docx stem when one
# exists, else the .pdf stem).
#
# Per plan:
#   requesting_unit         REQUIRED. Name of the OrgUnit whose purchase the plan covers.
#                           Part of the taap_identifier. `inferred: true` marks a name the
#                           form supports only through its signers or prose.
#   alternative_provided_by Optional. Unit named in the proposed alternative as delivering it.
#   vendor                  Optional. {name, contact_name, contact_email}. The product's company.
#   asset_class             Default third_party_service.
#   instructional           true -> also evidences 6.9-ins (EEAAPs for instructional materials).
#   preparer                Person name resolved from "Sara M." in the notes.
#   pdf / pdf_pages         Override the signed PDF pairing (one merged PDF holds two plans).
#   skip                    true -> not a plan (a duplicate parse of a merged PDF).
#   open_question           A Query node to raise when the form leaves a fact unknown.
#
# People: `people` maps a name as written on a form to the canonical Person name.

campus_default: ssu

people:
  "Dr. Sarah Ellison": "Sarah Ellison"
  "Dr. Gerald Jones": "Gerald Jones"
  "Gerald L. Jones": "Gerald Jones"
  "Dr. Elisabeth Wade": "Elisabeth Wade"
  "Jeffery Wilson": "Jeff Wilson"
  "Sean P. Place": "Sean Place"

preparer_default: "Sara Marquez"   # "Sara M." / "Sara A. Marquez" in the notes; Accessibility Student Assistant, SSU

evidence:
  # indicator composite key -> strength on the is_evidence_for edge; applied at the plan's
  # campus and academic year. 6.9-ins only when instructional; 1.19-web only when the
  # statement was posted where the product is accessed.
  always:
    8.10-pro: 3   # "Total number of EEAAPs completed": the plan is one of the counted units
    4.6-pro: 2    # "Develop a process for providing equally effective alternate access": one instance of the process
  instructional:
    6.9-ins: 2
  point_of_access:
    1.19-web: 1

plans:
